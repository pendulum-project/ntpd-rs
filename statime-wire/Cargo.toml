[package]
name = "statime-wire"
description = "Wire format of ptp messages, for use in ptp and ptp-based protocol implementations."
version = "0.1.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = ["std", "serde"]
std = ["statime-base/std"]
serde = ["dep:serde", "std"]

[dependencies]
serde = { workspace = true, optional = true }
statime-base.workspace = true

[dev-dependencies]
serde_test.workspace = true
