# a server that demobilizes on every incomming request

[observability]
log-level = "info"

# the server will get its time from the NTP pool
[[source]]
type = "ntp-pool"
address = "pool.ntp.org"
count = 4

[[server]]
type = "ntp"
listen = "0.0.0.0:123"

[server.allowlist]
ranges = []
action = "deny"

# configure the client with
# [[source]]
# type = "ntp"
# address = "<your ip here>:123"
