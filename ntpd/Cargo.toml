[package]
name = "ntpd"
readme = "README.md"
description.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true
rust-version.workspace = true
build = "build.rs"

[lints]
workspace = true

[dependencies]
ntp-proto.workspace = true
statime-base = { workspace = true, features = ["std"] }
statime-algo = { workspace = true, features = ["std"] }
statime-config.workspace = true
statime-seccomp = { workspace = true, optional = true }

hickory-resolver = { workspace = true, optional = true }
tokio = { workspace = true, features = ["rt-multi-thread", "io-util", "io-std", "fs", "sync", "net", "macros", "signal"] }
tracing.workspace = true
tracing-subscriber.workspace = true
toml.workspace = true
rand.workspace = true
libc.workspace = true
timestamped-socket.workspace = true
clock-steering.workspace = true
pps-time = { workspace = true, optional = true }

serde.workspace = true
serde_json.workspace = true

rustls23.workspace = true
rustls-openssl = { workspace = true, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
statime-wire = { workspace = true, features = ["serde"] }
statime-netptp.workspace = true
statime-csptp.workspace = true

[dev-dependencies]
ntp-proto = { workspace = true, features = ["__internal-test",] }
tokio-rustls.workspace = true

[features]
default = [ "aws-lc", "rustcrypto", "pps", "srv" ]
all-portable = [ "pps", "srv", "aws-lc", "rustcrypto", "openssl-vendored" ]
pps = [ "dep:pps-time" ]
srv = [ "dep:hickory-resolver" ]
aws-lc = ["rustls23/aws-lc-rs", "rustls23/prefer-post-quantum"] # the latter also turns on aws-lc-rs
rustcrypto = ["ntp-proto/rustcrypto"]
openssl = ["dep:rustls-openssl", "ntp-proto/openssl"]
openssl-vendored = ["openssl", "rustls-openssl/vendored"]
seccomp = [ "dep:statime-seccomp" ]

[package.metadata.deb]
name = "ntpd-rs"
priority = "optional"
section = "net"
copyright = "Copyright (c) 2022-2024 Trifecta Tech Foundation, Tweede Golf, and Contributors"
license-file = "../pkg/deb/COPYRIGHT-debian"
maintainer = "NTPD-rs Maintainers <ntpd-rs-maintainer@tweedegolf.com>"
maintainer-scripts = "../pkg/deb/"
assets = [
  ["target/release/statime-daemon", "/usr/bin/statime-daemon", "755"],
  ["target/release/statime", "/usr/bin/statime", "755"],
  ["target/release/statime-metrics", "/usr/bin/statime-metrics", "755"],
  ["docs/precompiled/man/statime.8", "/usr/share/man/man8/statime.8", "644"],
  ["docs/precompiled/man/statime-daemon.8", "/usr/share/man/man8/statime-daemon.8", "644"],
  ["docs/precompiled/man/statime-metrics.8", "/usr/share/man/man8/statime-metrics.8", "644"],
  ["docs/precompiled/man/statime.toml.5", "/usr/share/man/man5/statime.toml.5", "644"],
  ["docs/examples/conf/statime.toml.default", "/usr/share/doc/ntpd-rs/statime.toml.default", "644"],
  ["docs/examples/conf/statime.toml.default", "/etc/ntpd-rs/statime.toml", "644"],
  ["docs/examples/conf/ntpd-rs.preset", "/lib/systemd/system-preset/50-ntpd-rs.preset", "644"],
  ["docs/examples/conf/ntpd-rs.service", "/lib/systemd/system/ntpd-rs.service", "644"],
  ["docs/examples/conf/ntpd-rs-metrics.service", "/lib/systemd/system/ntpd-rs-metrics.service", "644"],
  ["../COPYRIGHT", "/usr/share/doc/ntpd-rs/COPYRIGHT", "644"],
  ["../LICENSE-APACHE", "/usr/share/doc/ntpd-rs/LICENSE-APACHE", "644"],
  ["../LICENSE-MIT", "/usr/share/doc/ntpd-rs/LICENSE-MIT", "644"],
  ["../CHANGELOG.md", "/usr/share/doc/ntpd-rs/CHANGELOG.md", "644"],
  ["../README.md", "/usr/share/doc/ntpd-rs/README.md", "644"],
]
conf-files = [
  "/etc/ntpd-rs/statime.toml",
]
provides = "time-daemon"
conflicts = "time-daemon"
replaces = "time-daemon"

[package.metadata.generate-rpm]
name = "ntpd-rs"
# See: https://fedoraproject.org/wiki/Licensing:Main?rd=Licensing#Good_Licenses
license = "MIT or ASL 2.0"
version = "2.0.0~alpha.20261113" #MARKER: RPM-VERSION
assets = [
  { source = "target/release/statime-daemon", dest = "/usr/bin/statime-daemon", mode = "755" },
  { source = "target/release/statime", dest = "/usr/bin/statime", mode = "755" },
  { source = "target/release/statime-metrics", dest = "/usr/bin/statime-metrics", mode = "755" },
  { source = "docs/precompiled/man/statime.8", dest = "/usr/share/man/man8/statime.8", mode = "644", doc = true },
  { source = "docs/precompiled/man/statime-daemon.8", dest = "/usr/share/man/man8/statime-daemon.8", mode = "644", doc = true },
  { source = "docs/precompiled/man/statime-metrics.8", dest = "/usr/share/man/man8/statime-metrics.8", mode = "644", doc = true },
  { source = "docs/precompiled/man/statime.toml.5", dest = "/usr/share/man/man5/statime-toml.5", mode = "644", doc = true },
  { source = "docs/examples/conf/statime.toml.default", dest = "/usr/share/doc/ntpd-rs/statime.toml.default", mode = "644", doc = true },
  { source = "docs/examples/conf/statime.toml.default", dest = "/etc/ntpd-rs/statime.toml", mode = "644", config = true },
  { source = "docs/examples/conf/ntpd-rs.service", dest = "/lib/systemd/system/ntpd-rs.service", mode = "644" },
  { source = "docs/examples/conf/ntpd-rs-metrics.service", dest = "/lib/systemd/system/ntpd-rs-metrics.service", mode = "644" },
  { source = "docs/examples/conf/ntpd-rs.preset", dest = "/lib/systemd/system-preset/50-ntpd-rs.preset", mode = "644" },
  { source = "../COPYRIGHT", dest = "/usr/share/doc/ntpd-rs/COPYRIGHT", mode = "644", doc = true },
  { source = "../LICENSE-APACHE", dest = "/usr/share/doc/ntpd-rs/LICENSE-APACHE", mode = "644", doc = true },
  { source = "../LICENSE-MIT", dest = "/usr/share/doc/ntpd-rs/LICENSE-MIT", mode = "644", doc = true },
  { source = "../CHANGELOG.md", dest = "/usr/share/doc/ntpd-rs/CHANGELOG.md", mode = "644", doc = true },
  { source = "../README.md", dest = "/usr/share/doc/ntpd-rs/README.md", mode = "644", doc = true },
]
